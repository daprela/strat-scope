[project]
name = "strat-scope-foundation"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = ["fastapi==0.159.1", "pydantic==2.14.1", "uvicorn==0.54.0", "pyarrow==26.0.0", "websockets==17.3"]

[dependency-groups]
dev = [
    "ruff==0.17.1",
    "basedpyright==1.40.2",
    "pytest==9.1.1",
    "httpx2==2.16.0",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = ["src", "tools", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
